<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1830" />
    <meta
      name="description"
      content="Missile Sky — fly freely in an open sky, dodge homing missiles, make them collide, survive the swarm."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Missile Sky — Open-Air Missile Survival</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Game screen"></canvas>
      <div id="ui"></div>
      <noscript>
        <div class="fatal-message">Missile Sky needs JavaScript enabled to play.</div>
      </noscript>
      <div id="fatal" class="fatal-message" hidden>
        <h1>Missile Sky</h1>
        <p id="fatal-text">
          Your browser does not support HTML5 Canvas, which this game requires.
          Please try a recent version of Chrome, Edge, Firefox or Safari.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
